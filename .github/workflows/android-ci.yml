name: Modern Rewrite CI

on:
  push:
    branches: ["rewrite/modern-foundation"]
    paths:
      - "modern/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "modern/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modern-rewrite-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    name: Go core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Download Go dependencies
        working-directory: modern/core
        run: go mod download
      - name: Test Go core
        working-directory: modern/core
        run: go test ./...

  android-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: modern/android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: poweronvpn-modern-debug-${{ github.run_number }}
          path: modern/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
